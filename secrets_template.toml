# =============================================================================
# Clinical Knowledge Base - 認証設定テンプレート
# =============================================================================
# このファイルを .streamlit/secrets.toml にコピーして、
# 実際の値に書き換えてください。
#
# 手順:
#   1. mkdir .streamlit
#   2. cp secrets_template.toml .streamlit/secrets.toml
#   3. .streamlit/secrets.toml を編集して実際の値を入れる
#
# 注意: .streamlit/secrets.toml は .gitignore に追加し、
#       絶対にGitにコミットしないでください。
# =============================================================================

# Google Drive の対象フォルダID
# URLが https://drive.google.com/drive/folders/XXXXX の場合、XXXXX の部分
folder_id = "YOUR_GOOGLE_DRIVE_FOLDER_ID"

# 患者データフォルダID（オプション）
# 患者検査画像を格納するGoogle Driveフォルダ。AI解析なし、手動入力用。
# 未設定の場合は従来通りの動作（この行を削除するか空文字のままでOK）
patient_folder_id = ""

# Gemini API キー
# Google AI Studio (https://aistudio.google.com/apikey) で取得する
GOOGLE_API_KEY = "YOUR_GEMINI_API_KEY"

# Google Sheets スプレッドシートID（データ永続化用）
# スプレッドシートのURLの /d/ここ/edit の部分
spreadsheet_id = "YOUR_GOOGLE_SHEETS_SPREADSHEET_ID"

# Google Cloud サービスアカウントの認証情報
# ダウンロードしたJSONキーの中身をここに転記する
[gcp_service_account]
type = "service_account"
project_id = "your-project-id"
private_key_id = "your-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY_HERE\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-project-id.iam.gserviceaccount.com"
client_id = "123456789"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project-id.iam.gserviceaccount.com"
